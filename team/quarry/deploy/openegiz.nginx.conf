server {
    listen 80;
    listen [::]:80;
    server_name openegiz.ecoout.com.kz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/openegiz-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://openegiz.ecoout.com.kz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name openegiz.ecoout.com.kz;

    ssl_certificate /etc/letsencrypt/live/openegiz.ecoout.com.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openegiz.ecoout.com.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OPENEGIZ:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/openegiz/current;
    index welcome.html;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        try_files /welcome.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        return 404;
    }

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
}
