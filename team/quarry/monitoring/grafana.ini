[server]
http_addr = 127.0.0.1
http_port = 3301
domain = openegiz.ecoout.com.kz
root_url = https://openegiz.ecoout.com.kz/grafana/
serve_from_sub_path = true
[auth.anonymous]
enabled = true
org_role = Viewer
[users]
allow_sign_up = false
allow_org_create = false
viewers_can_edit = false
[security]
cookie_secure = true
cookie_samesite = lax
disable_gravatar = true
[analytics]
reporting_enabled = false
check_for_updates = false
[dashboards]
default_home_dashboard_path = /etc/openegiz-monitoring/dashboards/quarry.json
min_refresh_interval = 5s
